# Generic bills pack. Billers are fed by BillBot; fill in real senders after import.
module: bills
title: {en: Bills, ar: الفواتير}
billers:
  - id: electric
    name: Example Electric   # the name BillBot files this sender under
    title: {en: Pay the electric bill, ar: سداد فاتورة الكهرباء}
    kind: bill
    cadence_days: 31
    grace_days: 7
    sender_domains: [example-utility.com]
  - id: water
    name: Example Water
    title: {en: Pay the water bill, ar: سداد فاتورة المياه}
    kind: bill
    cadence_days: 31
    grace_days: 7
    sender_domains: [example-water.com]
  - id: internet
    name: Example Internet
    title: {en: Pay the internet bill, ar: سداد فاتورة الإنترنت}
    kind: bill
    cadence_days: 31
    grace_days: 7
    sender_domains: [example-isp.com]
duties:
  - id: bills-review
    title: {en: Review bills and confirm all are paid}
    schedule: {type: day_of_month, days: [1]}
    remind: [0d]
